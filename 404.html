<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — MedicalCare</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a4ba8, #1c8dfc);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            background: white;
            border-radius: 24px;
            padding: 3rem 2.5rem;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.2);
            animation: fadeUp 0.6s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .icon-wrap {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #0a4ba8, #1c8dfc);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }
        .icon-wrap i { font-size: 2.5rem; color: white; }

        .code { font-size: 5rem; font-weight: 800; color: #0a4ba8; line-height: 1; margin-bottom: 0.5rem; }
        h1 { font-size: 1.4rem; color: #1a2a44; margin-bottom: 0.8rem; }
        p  { color: #666; font-size: 0.95rem; line-height: 1.6; margin-bottom: 2rem; }

        .links {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: 0.25s;
            cursor: pointer;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #0a4ba8, #1c8dfc);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.18); }

        .btn-outline {
            background: white;
            color: #0a4ba8;
            border: 2px solid #0a4ba8;
        }
        .btn-outline:hover { background: #eaf2ff; }

        .countdown {
            margin-top: 1.5rem;
            font-size: 0.82rem;
            color: #aaa;
        }
        .countdown span { font-weight: 700; color: #0a4ba8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-wrap">
            <i class="ri-stethoscope-line"></i>
        </div>

        <div class="code">404</div>
        <h1>Page Not Found</h1>
        <p>
            Oops! The page you're looking for doesn't exist or has been moved.
            Don't worry — our doctors are still here for you.
        </p>

        <div class="links">
            <a href="index.html" class="btn btn-primary">
                <i class="ri-home-4-line"></i> Go Home
            </a>
            <a href="login.html" class="btn btn-outline">
                <i class="ri-calendar-line"></i> Book Appointment
            </a>
            <a href="doctor.html" class="btn btn-outline">
                <i class="ri-team-line"></i> Our Doctors
            </a>
        </div>

        <p class="countdown">Redirecting to home in <span id="timer">10</span> seconds...</p>
    </div>

    <script>
        // Countdown and auto-redirect using setInterval
        let seconds = 10;
        const timerEl = document.getElementById("timer");

        const interval = setInterval(() => {
            seconds--;
            timerEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = "index.html";
            }
        }, 1000);
    </script>
</body>
</html>
